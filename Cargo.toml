[workspace]
resolver = "2"
members = ["crates/common/*", "crates/server/*", "crates/client/*", "crates/e2e/*"]
# `vendor/` is third-party source, not one of the three groups, and its crates
# are built through the patch below rather than as members. See vendor/README.md.
exclude = ["vendor"]

# `egui-wgpu 0.35` is on wgpu 29 and this client is on wgpu 30, and the two do
# not mix: a `Device` from one is not a `Device` for the other. The vendored copy
# is that crate with the four wgpu 30 changes applied, and it is temporary — see
# vendor/README.md for the exit condition.
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
# `wgpu 30.0.0` reuses an in-flight Vulkan acquire fence on non-Windows
# surfaces, causing validation errors on the second frame. Upstream fixed this
# in #9918; keep the patch pinned until crates.io publishes the backport.
wgpu = { git = "https://github.com/gfx-rs/wgpu.git", rev = "e904d2eac09a9494fb8a453b7e0278fb06e8693c" }

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hideOut/OpenShard"
authors = ["OpenShard contributors"]

# A debug build is mostly debug info, and most of the debug info is Tokio's.
#
# Nobody steps into `serde_derive`. Symbols for dependencies are bytes that will
# never be read by anyone, and there are gigabytes of them: this workspace's
# `target/` was 2.7GB before this block and it is the reason a sandbox ran out of
# disk mid-test. `debug = false` on dependencies only — the workspace's own
# crates keep theirs, because those are the backtraces that get read.
#
# `opt-level = 2` on the same glob, and it is the whole of what "the debug
# client runs at twenty frames a second" was. `"*"` is dependencies only —
# Cargo excludes workspace members from it — so this buys nothing in
# debuggability: a backtrace through `egui` or `wgpu` was never the one being
# read, and the crates that are stepped through keep their own settings below.
#
# Measured on the widest-zoom Britain scene, pinned, on the discrete adapter:
# frame build p50 19.9ms -> 16.0ms, which is the surface's own 60Hz and
# therefore the end of it. `ui` 2.13ms -> 0.33ms and `ui_layout` 1.69ms ->
# 0.23ms, because egui laid out a frame at `opt-level = 0`; `encode` 5.45ms ->
# 2.38ms, most of it `encode_statics` at 3.31ms -> 0.86ms in wgpu's own command
# recording.
#
# It costs one full dependency rebuild — about a minute and a half on twelve
# cores — and nothing after that: an edit to a workspace crate recompiles the
# same crates it always did. See `docs/client_jank_plan.md`.
[profile.dev.package."*"]
debug = false
opt-level = 2

# The same, for the profile `cargo test` builds under.
[profile.test.package."*"]
debug = false
opt-level = 2

# The client's per-frame CPU work does not survive being unoptimized.
#
# A frame walks the visible tile rectangle four times — twice to ask what art it
# needs, twice to build the quads — and that rectangle is ~9,800 cells at 1080p.
# Measured on that size: `ground::collect` alone is 9.7ms at `opt-level = 0` and
# 1.2ms at `opt-level = 1`, and `visible_graphics` 1.2ms against 0.11ms. Ground
# is the cheaper half; the statics walk the same rectangle and there are more
# statics than tiles in a city. Two digits of milliseconds per frame is what
# "scrolling the map is slow in a debug build" was.
#
# `opt-level = 1` and not 2: it is where the whole win is here (1.18ms against
# release's 1.32ms — the rest is `sort_by_key`, already optimized in libstd), and
# it keeps line tables and locals intact, so a breakpoint in this code still
# means something. Named crate by crate rather than set on the whole profile,
# because the server is stepped through and this is not a debuggability tax it
# should pay: what is listed is the render path and the client-file decoders
# under it.
[profile.dev.package.openshard-client-render]
opt-level = 1
[profile.dev.package.openshard-client-app]
opt-level = 1
[profile.dev.package.openshard-uofiles]
opt-level = 1
[profile.dev.package.openshard-protocol]
opt-level = 1

[workspace.dependencies]
# Fast non-cryptographic hashing for hot integer-keyed maps.
rustc-hash = "2.1"
# Internal crates
openshard-ai = { path = "crates/server/ai", version = "0.0.1" }
openshard-basemap = { path = "crates/common/basemap", version = "0.0.1" }
openshard-chat = { path = "crates/server/chat", version = "0.0.1" }
openshard-client-app = { path = "crates/client/app", version = "0.0.1" }
openshard-client-artscan = { path = "crates/client/artscan", version = "0.0.1" }
openshard-client-net = { path = "crates/client/net", version = "0.0.1" }
openshard-client-model = { path = "crates/client/model", version = "0.0.1" }
openshard-client-pathtrace = { path = "crates/client/pathtrace", version = "0.0.1" }
openshard-client-render = { path = "crates/client/render", version = "0.0.1" }
openshard-combat = { path = "crates/server/combat", version = "0.0.1" }
openshard-commands = { path = "crates/common/commands", version = "0.0.1" }
openshard-config = { path = "crates/common/config", version = "0.0.1" }
openshard-crafting = { path = "crates/server/crafting", version = "0.0.1" }
openshard-e2e-shard = { path = "crates/e2e/shard", version = "0.0.1" }
openshard-entities = { path = "crates/common/entities", version = "0.0.1" }
openshard-events = { path = "crates/common/events", version = "0.0.1" }
openshard-gateway = { path = "crates/server/gateway", version = "0.0.1" }
openshard-guilds = { path = "crates/server/guilds", version = "0.0.1" }
openshard-party = { path = "crates/server/party", version = "0.0.1" }
openshard-boats = { path = "crates/server/boats", version = "0.0.1" }
openshard-housing = { path = "crates/server/housing", version = "0.0.1" }
openshard-items = { path = "crates/server/items", version = "0.0.1" }
openshard-login = { path = "crates/server/login", version = "0.0.1" }
openshard-magic = { path = "crates/server/magic", version = "0.0.1" }
openshard-map = { path = "crates/common/map", version = "0.0.1" }
openshard-metrics = { path = "crates/common/metrics", version = "0.0.1" }
openshard-movement = { path = "crates/common/movement", version = "0.0.1" }
openshard-npc = { path = "crates/server/npc", version = "0.0.1" }
openshard-persistence = { path = "crates/server/persistence", version = "0.0.1" }
openshard-plugins = { path = "crates/server/plugins", version = "0.0.1" }
openshard-protocol = { path = "crates/common/protocol", version = "0.0.1" }
openshard-quests = { path = "crates/server/quests", version = "0.0.1" }
openshard-server = { path = "crates/server/server", version = "0.0.1" }
openshard-skills = { path = "crates/server/skills", version = "0.0.1" }
openshard-state = { path = "crates/server/state", version = "0.0.1" }
openshard-tiles = { path = "crates/common/tiles", version = "0.0.1" }
openshard-uofiles = { path = "crates/common/uofiles", version = "0.0.1" }
openshard-world = { path = "crates/server/world", version = "0.0.1" }

# External
anyhow = "1"
async-trait = "0.1"
bytes = "1"
# The binaries' command lines. `env` is the feature that matters here: every
# option a binary takes is also the environment variable it was taken from
# before, so a shell that exports it and a shell that types it get the same run,
# and `--help` is the one place both are written down.
clap = { version = "4", features = ["derive", "env"] }
# Rasterizes an operator-supplied TrueType/OpenType face
# (`openshard_uofiles::ttf_font`) for the code points `fonts.mul` never
# shipped — Cyrillic today. Pure Rust, no system font stack: the same
# rasterizer runs identically on every platform this workspace targets,
# including the wasm32 client build.
fontdue = "0.9"
# `.env` beside the workspace root, read before the command line is parsed. What
# it holds is one operator's client install — a path that must never be
# committed, which is why the file is in `.gitignore` and `.env.example` is the
# version under review.
dotenvy = "0.15"
# `gumpartLegacyMUL.uop` marks every one of its 5,556 entries compression flag
# 3, which is zlib, and only zlib — the flag also covers a second,
# container-specific pass that this client never turns on. Pulled in directly
# rather than through `flate2`'s `rust_backend`: that feature is this crate and
# nothing else, so the extra layer buys nothing, and `unsafe_code = "deny"`
# workspace-wide rules out `flate2`'s C backend anyway.
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Property-based fuzzing over a hand-written oracle — random scenes, shrunk to
# a minimal failing case rather than one fixed fixture per bug. Dev-only.
proptest = "1"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "vorbis", "flac", "wav"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Deliberately not `panic = "abort"`. A panic in one connection's task should
# drop that connection, not take the shard down with it.

[profile.bench]
lto = "thin"
