[workspace]
resolver = "2"
members = ["crates/common/*", "crates/server/*", "crates/client/*", "crates/e2e/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
# GPL-3.0, plus the additional permission in `LICENSE-EXCEPTION` covering the
# TypeScript loaded into the embedded runtime. SPDX only spells `WITH` for
# exceptions on its own registry, so the field names the licence alone and the
# grant lives in the file beside `LICENSE`.
license = "GPL-3.0-only"
repository = "https://github.com/hideOut/OpenShard"
authors = ["OpenShard contributors"]

# A debug build is mostly debug info, and most of the debug info is Tokio's.
#
# Nobody steps into `serde_derive`. Symbols for dependencies are bytes that will
# never be read by anyone, and there are gigabytes of them: this workspace's
# `target/` was 2.7GB before this block and it is the reason a sandbox ran out of
# disk mid-test. `debug = false` on dependencies only — the workspace's own
# crates keep theirs, because those are the backtraces that get read.
[profile.dev.package."*"]
debug = false

# The same, for the profile `cargo test` builds under.
[profile.test.package."*"]
debug = false

[workspace.dependencies]
# Internal crates
openshard-ai = { path = "crates/server/ai", version = "0.0.1" }
openshard-chat = { path = "crates/server/chat", version = "0.0.1" }
openshard-client-net = { path = "crates/client/net", version = "0.0.1" }
openshard-client-render = { path = "crates/client/render", version = "0.0.1" }
openshard-combat = { path = "crates/server/combat", version = "0.0.1" }
openshard-config = { path = "crates/common/config", version = "0.0.1" }
openshard-crafting = { path = "crates/server/crafting", version = "0.0.1" }
openshard-entities = { path = "crates/common/entities", version = "0.0.1" }
openshard-events = { path = "crates/common/events", version = "0.0.1" }
openshard-gateway = { path = "crates/server/gateway", version = "0.0.1" }
openshard-guilds = { path = "crates/server/guilds", version = "0.0.1" }
openshard-housing = { path = "crates/server/housing", version = "0.0.1" }
openshard-items = { path = "crates/server/items", version = "0.0.1" }
openshard-login = { path = "crates/server/login", version = "0.0.1" }
openshard-magic = { path = "crates/server/magic", version = "0.0.1" }
openshard-metrics = { path = "crates/common/metrics", version = "0.0.1" }
openshard-movement = { path = "crates/common/movement", version = "0.0.1" }
openshard-npc = { path = "crates/server/npc", version = "0.0.1" }
openshard-persistence = { path = "crates/server/persistence", version = "0.0.1" }
openshard-plugins = { path = "crates/server/plugins", version = "0.0.1" }
openshard-protocol = { path = "crates/common/protocol", version = "0.0.1" }
openshard-quests = { path = "crates/server/quests", version = "0.0.1" }
openshard-scripting = { path = "crates/server/scripting", version = "0.0.1" }
openshard-server = { path = "crates/server/server", version = "0.0.1" }
openshard-skills = { path = "crates/server/skills", version = "0.0.1" }
openshard-state = { path = "crates/server/state", version = "0.0.1" }
openshard-uofiles = { path = "crates/common/uofiles", version = "0.0.1" }
openshard-world = { path = "crates/server/world", version = "0.0.1" }

# External
anyhow = "1"
deno_core = "0.408"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Deliberately not `panic = "abort"`. A panic in one connection's task should
# drop that connection, not take the shard down with it.

[profile.bench]
lto = "thin"
