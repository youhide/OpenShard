[package]
name = "openshard-client-net"
description = "The client's side of the wire: framing, decompression, and the login conversation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
openshard-client-model.workspace = true
# The file a client keeps the shard's ground in — see `cache.rs`. It is a base
# set of ours, read back through the same `load` the shard's own boot uses, which
# is what makes "the client's world" and "the shard's world" one format rather
# than two that agree.
openshard-basemap.workspace = true
# Where a thing is on a facet: `Tile`, the plane a view and a walk both address.
openshard-map.workspace = true
openshard-protocol.workspace = true
# The walk handshake, shared with the server: `intend` is the turn-versus-step
# rule both ends have to agree on, and `StepCounter` is the client half of the
# sequence rule `WalkSequence` enforces. See `walk.rs`.
openshard-movement.workspace = true
# The same narrow set the gateway takes: this crate opens sockets and nothing
# else. The parsing half is sans-io and does not touch tokio at all.
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros"] }
tracing.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# One fixture facet's land ids, for the chunk fetch's round trip. What a tile
# *means* is still nothing this crate reads — see `chunks.rs`.
openshard-tiles.workspace = true
