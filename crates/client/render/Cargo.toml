[package]
name = "openshard-client-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Draws what the client has been shown: isometric ground, and eventually everything above it."

# This crate never opens a file, never spawns a thread, and never creates a
# window or an adapter. It is handed a `Device`, a `Queue` and something to draw
# into, and it draws. That is not minimalism for its own sake: it is what lets
# the same code run against a surface on the desktop, against a canvas in a
# browser, and against an offscreen texture in a test — where a frame can be
# read back and asserted on, which is the only way a renderer gets an oracle.
[dependencies]
openshard-client-model.workspace = true
openshard-map.workspace = true
openshard-tiles.workspace = true
openshard-uofiles.workspace = true
openshard-protocol.workspace = true
# For the walk's pace, and for nothing else: the camera bench walks a scripted
# body at the rate `common/movement` says a body walks at.
openshard-movement.workspace = true
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
# One log line: decision 38.2's ring radius. Emits nothing without a
# subscriber, so this costs no I/O and keeps the crate's own header true.
tracing.workspace = true
rustc-hash.workspace = true

# On the web the only backend is the browser's own. WebGL2 is the fallback for
# browsers without WebGPU, and keeping it in the feature set here is what makes
# the shader's limits real rather than aspirational: no storage buffers, no
# compute, instancing through vertex buffers.
# `default-features = false` above turns the backends off with everything else,
# so the native ones are named here. Without them `request_adapter` finds
# nothing and every GPU test skips itself — green, and testing nothing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "metal", "dx12", "gles"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgl"] }

[lints]
workspace = true

# Compiles `src/shaders/*.wesl` — a shared, `import`-able module for the
# `place` attachment's bit format (`docs/archive/render/lighting_raymarch.md`'s backlog) —
# into plain WGSL at build time. This crate's first build-dependency: under
# plain WGSL each shader module is its own compilation unit with no
# `#include`, so the format was five hand-copied `const` blocks, one per
# shader, free to drift silently — session 23's ground-shadow bug was
# exactly that (`ground.wgsl` never copied the bit `STANCE_FLAT` lives at).
[build-dependencies]
wesl = "0.4"

[dev-dependencies]
pollster = "1.0.1"
proptest.workspace = true
# `examples/shard/mod.rs`: the shard's own database, so a scene tool draws what
# the *server* placed and not only what the client's files hold. Dev-only, and
# the direction of the arrow is the point — `openshard-persistence` is a server
# crate that `crates/client/*` may never depend on (`docs/architecture.md`), so
# the two tables are read by SQL rather than through its `Store`. The same
# version and the same `bundled` feature as that crate, so the workspace builds
# one SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
# Where the shard keeps its world: `[persistence].database` out of the operator's
# own `openshard.toml`, rather than a path a tool's caller retypes.
openshard-config.workspace = true
# The reference path tracer `examples/boxes.rs` lays beside the rendered frame.
# A dev-dependency and never a real one: it is a third opinion about a scene
# this crate drew, and the direction of the arrow is what keeps it one — that
# crate cannot see this one, so it cannot accidentally share an answer with it.
openshard-client-pathtrace.workspace = true
