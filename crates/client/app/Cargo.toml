[package]
name = "openshard-client-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The client binary: a window, a surface, and a camera over the map."

# The only crate on the client side that is allowed to touch the platform. It
# opens the files, asks for an adapter and owns the event loop; `client/render`
# is handed the results and knows about none of it. That split is what keeps the
# renderer testable offscreen and portable to a canvas.
[dependencies]
openshard-client-render.workspace = true
openshard-client-editor.workspace = true
# What was measured off the art before the client started, and the reader for it.
# The measurement itself is not this binary's: `docs/archive/render/lighting.md`'s decision 31
# moves it into a tool with a budget of a minute, and what is left here is a file
# to look for and a log line when there is none.
openshard-client-artscan.workspace = true
# The wire. This binary owns the thread it runs on and nothing about the
# protocol itself — see `link.rs`.
openshard-client-net.workspace = true
openshard-protocol.workspace = true
# The staff command vocabulary the speech line completes from — the same table
# the world dispatches on, so a command this offers is a command that runs. See
# that crate's docs for why it is one list and not two.
openshard-commands.workspace = true
# For one constant: how long a step on foot takes, which is what decides when a
# body that stopped hearing steps stops walking. Shared with the server rather
# than guessed at again here.
openshard-movement.workspace = true
openshard-map.workspace = true
# The route journal: one line per click and per replan, into the file
# `OPENSHARD_PATH_JOURNAL` names, and nothing at all when it names none. What
# reads it back is `openshard-movement`'s `path_replay` example.
openshard-pathlog.workspace = true
openshard-tiles.workspace = true
openshard-uofiles.workspace = true
# The binary's command line, and the `.env` its options fall back to. Only
# `main.rs` uses them: the library takes an install and a plan, so a caller with
# a shard of its own — `crates/e2e/playground` — parses nothing.
clap.workspace = true
dotenvy.workspace = true
pollster = "1.0"
# The dev HUD. `egui-wgpu` is the vendored port to wgpu 30 — see vendor/README.md
# — and `default-features = false` because its default pulls `wgpu/default`,
# which is every backend and the opposite of the explicit lists below.
egui = "0.36"
# `egui-winit`'s default set is dropped for the same reason, but three of its
# features have to come back by name: `clipboard` is what carries a
# `Context::copy_text` through to the system clipboard (without it the text is
# put in `platform_output` and silently dropped — the Tile panel's copy buttons
# did nothing), and it needs `wayland`/`x11` because the Linux backend it uses
# is chosen by which of those is compiled in.
egui-winit = { version = "0.36", default-features = false, features = [
    "clipboard",
    "wayland",
    "x11",
] }
egui-wgpu = { version = "0.36", default-features = false }
# `rt` for the shard thread's own current-thread runtime, `macros` for the
# select! that reads the socket and the keyboard at once, `sync` for the channel
# between them. No `net`: the sockets belong to `client/net`.
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# What the HUD remembers between runs — see `desk.rs`. RON keeps nested
# preferences readable without forcing TOML tables to mirror UI ownership.
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
toml.workspace = true
winit = "0.30"
# Where a frame's time actually went. Two halves, because a frame has two and
# the client can only time one of them for itself:
#
# - `wgpu-profiler` writes timestamp queries around each pass, which is the only
#   way this client can see the GPU at all: `queue.submit` does not block, so
#   everything `frames::Frame::scene` measures is the CPU *encoding* the frame
#   and none of the GPU drawing it. Pinned to `wgpu 30.0.0` by its own manifest,
#   which is the version this crate is on.
# - `puffin` is the CPU side: nested scopes with names, streamed out of the
#   process by `puffin_http` and read in the standalone `puffin_viewer`
#   (`cargo install puffin_viewer`, then connect to 127.0.0.1:8585).
#
# Out of process, and deliberately: `puffin_egui` would draw the flamegraph in
# this window, but its latest release is on `egui 0.28` against the `0.35` above
# — a second egui in the tree, with its own context and its own fonts. The GPU
# numbers come back into the HUD's own `frames` panel instead, where they belong
# beside `ui`/`world`/`waited`; the flamegraph is the viewer's job.
#
# `wgpu-profiler/puffin` is what joins the two: the GPU's spans are reported
# into the same puffin frame as the CPU's, under a thread called `GPU`, so one
# timeline holds both.
puffin = "0.20"
wgpu-profiler = { version = "0.28", default-features = false, features = ["puffin"] }

[dev-dependencies]
# DST's event timeline also serves as the headless boundary for movement-core
# fuzzing: random packet outcomes and long frames are shrunk to one sequence.
proptest.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles"] }
rodio.workspace = true
# The TCP server the viewer connects to. Native only: it is a socket.
puffin_http = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgl"] }

[lints]
workspace = true
