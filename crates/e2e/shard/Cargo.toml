[package]
name = "openshard-e2e-shard"
description = "End-to-end tests: the client crates against a real shard, over real sockets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

# What it takes to start a shard and to say who logs in to it. These are
# dependencies rather than dev-dependencies because `crates/e2e/playground`
# links against this crate — it is the same shard with a window in front of it —
# and a dev-dependency is not there for a sibling to use.
#
# Both ends of the wire are named here, which no other crate in the workspace may
# do. That is the whole reason `crates/e2e/*` is its own group.
[dependencies]
openshard-client-net.workspace = true
openshard-config.workspace = true
openshard-gateway.workspace = true
openshard-protocol.workspace = true
openshard-server.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
toml.workspace = true

[dev-dependencies]
# For `StaffCommand::matching` in `tests/staff_authority.rs`: what the shard's
# `AuthorityNotice` is *for* is the completer, so the test asserts the
# consequence and not only the byte.
openshard-commands.workspace = true
# For `WALK_BUFFER` only: the burst that provokes the `0x21` this test needs as
# an oracle has to be bigger than the pace budget, and a number written here
# would stop being bigger the day the budget grew.
#
# And, in `tests/map_edit.rs`, for the span bake and the navigation artifact: a
# shard boots from a base set only if a graph stamped against it is lying beside
# it, so a test that starts one has to make both.
openshard-movement.workspace = true
# The four crates `tests/map_edit.rs` needs to *be* the import pipeline: the
# world (`map`), the file it goes in (`basemap`), the tile table it is read
# against (`tiles`, out of `uofiles`). A fixture that wrote those files its own
# way would be testing a pipeline the shard does not have.
openshard-basemap.workspace = true
openshard-map.workspace = true
openshard-tiles.workspace = true
openshard-uofiles.workspace = true
# To reopen, from outside the shard, the database the shard wrote: `tests/
# stop_saves.rs` is the only assertion anywhere that a stop actually saved. A
# dev-dependency because the reading end is a test's, not the playground's.
openshard-persistence.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
