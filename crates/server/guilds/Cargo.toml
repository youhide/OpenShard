[dev-dependencies]
# The tests build a bare `WorldState` — no map, no clients, just a registry and
# the guild table. Every part of one is in `openshard-state` except the bus.
openshard-events.workspace = true
# A bare `WorldState` names its start tile and its tile and multi tables even
# when the fixture wants all three empty.
openshard-map.workspace = true
openshard-tiles.workspace = true
openshard-uofiles.workspace = true
