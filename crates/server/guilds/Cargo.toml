[package]
name = "openshard-guilds"
description = "Guilds: founding, membership, titles, and the war and alliance handshake."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
openshard-entities.workspace = true
openshard-gateway.workspace = true
openshard-protocol.workspace = true
openshard-state.workspace = true

[dev-dependencies]
# The tests build a bare `WorldState` — no map, no clients, just a registry and
# the guild table. Every part of one is in `openshard-state` except the bus.
openshard-events.workspace = true
# The shard's tile and multi tables are typed by the file reader, so a bare
# `WorldState` literal names them even when it wants both empty.
openshard-tiles.workspace = true
openshard-uofiles.workspace = true
