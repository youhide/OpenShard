[package]
name = "openshard-crafting"
description = "Making things: the craft systems, their recipes, and the gump that drives them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
openshard-entities.workspace = true
# Making a thing and eating the materials are both `items`' doors. Acyclic:
# `items` depends on neither this crate nor `skills`.
openshard-items.workspace = true
# The roll a craft makes is the roll a mined vein and a swung sword make.
openshard-skills.workspace = true
# For `Tile`, when scanning the map's own statics for a forge.
# `Tile`: where on the facet a crafting station stands.
openshard-map.workspace = true
openshard-movement.workspace = true
# For the gump builder and `Point`.
openshard-protocol.workspace = true
openshard-state.workspace = true
# For `ConnectionId` alone — a gump reply names the connection it came from.
openshard-gateway.workspace = true
tracing.workspace = true

# Tests only, and deliberately not a dependency: inscription's scroll rows carry
# the reagents and the mana of the spells they write down, and the spells
# themselves live in `magic`. The shard reads neither from here — the rows are
# data — but the two halves are hand-carried from the same C# and would drift in
# silence, so one test asks them the same question. `magic` does not depend on
# this crate, so the graph stays acyclic.
[dev-dependencies]
openshard-magic.workspace = true

# `build.rs` only: the recipe tables are `data/*.json` and become `const`s before
# the crate compiles. Nothing here is linked into the shard.
[build-dependencies]
serde.workspace = true
serde_json.workspace = true
