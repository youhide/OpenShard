[package]
name = "openshard-server"
description = "The shard binary: wires the gateway to the login server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "openshard_server"
path = "src/lib.rs"

[[bin]]
name = "openshard"
path = "src/main.rs"

[dependencies]
clap.workspace = true
openshard-basemap.workspace = true
openshard-config.workspace = true
openshard-events.workspace = true
openshard-gateway.workspace = true
openshard-login.workspace = true
openshard-map.workspace = true
openshard-movement.workspace = true
openshard-persistence.workspace = true


openshard-protocol.workspace = true
openshard-quests.workspace = true
openshard-state.workspace = true
openshard-tiles.workspace = true
openshard-uofiles.workspace = true
openshard-world.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
