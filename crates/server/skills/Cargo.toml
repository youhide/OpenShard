[package]
name = "openshard-skills"
description = "Skill definitions, usage checks, and gain curves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
openshard-config.workspace = true
# `items` for the skills that reach into a pack — Stealing, and the bandage and
# instrument slices to come. Acyclic today, and an invariant from here on: `items`
# must never depend on `skills` or `combat`, or `skills → items → combat → skills`
# closes.
openshard-items.workspace = true
openshard-entities.workspace = true
# For the `Terrain` trait alone — the harvest slice reads what the ground *is*
# (a mountain land tile, a tree static) through the same abstraction movement
# checks steps against.
# `Tile`: where on the facet a harvest is attempted.
openshard-map.workspace = true
openshard-movement.workspace = true
# For `ConnectionId` alone — a handler that raises its own cursor has to name the
# connection it sends to.
openshard-gateway.workspace = true
# For `SkillLock` alone — the up/down/lock arrow is a wire value the client sets,
# and the gain reads it, so both ends name the same type.
openshard-protocol.workspace = true
openshard-state.workspace = true
