[package]
name = "openshard-state"
description = "The world's runtime state: components, the spatial index, and the seeded generator every system operates on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
openshard-commands.workspace = true
openshard-config.workspace = true
openshard-entities.workspace = true
openshard-events.workspace = true
openshard-gateway.workspace = true
# For `MapSnapshot`, which is what a facet's ground *is*: the published map and
# the revision a reader holds of it. A facet used to keep a boxed `Terrain`
# so this crate could stay below the map — an abstraction it never used for
# anything but hiding one concrete type. See `docs/world/research/terrain_seam.md`'s node D.
openshard-map.workspace = true
openshard-movement.workspace = true
openshard-protocol.workspace = true
# For `multi::Component`, which a customised house's design is a list of. The
# type is already reachable through `openshard-movement`, which re-exports only
# `LandTile` from this crate — so the edge is named here rather than smuggled
# through a re-export. **No file reader comes with it**: D2a's rule is that this
# crate never holds the multi *table*, and a design is world state that happens
# to be shaped like one. See `docs/housing/design_customisation.md`'s C1.
openshard-tiles.workspace = true
openshard-uofiles.workspace = true
serde.workspace = true
tracing.workspace = true

# `build.rs` only: the body-type, mount and skill tables are `data/*.json` and
# become `const`s before the crate compiles. Nothing here is linked into the shard.
[build-dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
