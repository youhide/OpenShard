[package]
name = "openshard-housing"
description = "Player houses: placement, customisation, lockdowns, and secures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
openshard-entities.workspace = true
# The sign's window is answered per connection, like every other gump's.
openshard-gateway.workspace = true
# `Tile`: a house's footprint is a set of them.
openshard-map.workspace = true
openshard-movement.workspace = true
openshard-protocol.workspace = true
openshard-state.workspace = true
# For the multi's own bounding box, which is where a house's sign hangs. The
# component type already arrives through `Terrain::multi_components`; this is the
# arithmetic over it, and computing it here instead would be a second copy of
# what `Multi::center` is derived from.
openshard-tiles.workspace = true
openshard-uofiles.workspace = true

[dev-dependencies]
# The tests stand a bare `WorldState` up with a terrain that knows one multi:
# every part of one is in `openshard-state` except the bus.
openshard-events.workspace = true
# `house_stair_audit --saved-step` opens a shard save read-only and asks the
# production footing about the character's next tile.
rusqlite = { version = "0.32", features = ["bundled"] }
