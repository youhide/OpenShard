# OpenShard configuration.

[server]
name = "OpenShard"

# Where to bind. 0.0.0.0 listens on every interface.
listen = "0.0.0.0:2593"

# What to TELL CLIENTS to dial, in the 0x8C relay packet.
#
# NOT the same as `listen`, and the single most likely reason a client hangs.
# `listen` is where this shard answers; `advertise` is the address it hands out.
# Get it wrong and the failure is silent from here: the client logs in fine,
# picks the shard, is told to dial somewhere it cannot reach, and sits on
# "logging into shard" until it times out. This end sees one connection and a
# disconnect, and nothing that looks like an error, because nothing here failed.
#
# The default only works if the client runs on THIS MACHINE. A client anywhere
# else — another PC, a VM, a phone — will dial its own 127.0.0.1 and find
# nothing.
#
#   client on this machine   127.0.0.1:2593
#   client on your LAN       this machine's LAN address, e.g. 192.168.1.10:2593
#   client over the internet your PUBLIC address, with 2593 forwarded
advertise = "127.0.0.1:2593"

[world]
# The client install directory, holding map0LegacyMUL.uop and tiledata.mul.
#
# Leave empty and the shard runs with no map at all: every step is allowed and
# players walk through walls and across water. Useful for testing the protocol,
# useless as a game.
client_files = ""

# Which facets to load: 0 is Felucca, then Trammel, Ilshenar, Malas, Tokuno,
# Ter Mur. A character stays on its facet; there is no travel between them yet.
facets = [0]

# Where a facet's world comes from, when it does not come from the install.
#
# One line per facet, keyed by the same number `facets` lists. A facet named
# here is read from that base set -- OpenShard's own map format, written once by
#
#   cargo run --release -p openshard-uofiles --bin openshard-map-import -- \
#       --facet 0 --out felucca.osbase
#
# -- and a facet not named here comes out of the install as before, so a shard
# converts one facet at a time.
#
# It does not replace `client_files`. A base set holds the map: the ground and
# the statics. `tiledata.mul` still says what a tile *is*, and the multis still
# say what a house is, so both are still read from the install. Naming a base
# set with `client_files` empty is refused rather than run.
#
# [world.base_sets]
# 0 = "felucca.osbase"

# Which facets let bodies walk through each other -- ServUO's
# MapRules.FreeMovement, and the first thing a shove asks about.
#
# One line per facet, keyed like `base_sets`. A facet not named here keeps the
# answer its number meant in retail: off on facet 0 (Felucca, where getting past
# somebody standing in a doorway costs 10 stamina) and on everywhere else.
#
# Setting it against the number is a real choice with a real cost. The stock
# client decides this for itself, hardcoded, from the facet number alone -- it is
# never told -- so a facet that disagrees is one where the client draws a step
# the shard then refuses, and a player feels it as being snapped back a tile.
#
# [world.free_movement]
# 3 = false

# The seed the world's rolls start from, on a world that has never been saved.
#
# Leave it out and the engine's own default seed stands. Set it to reproduce a
# fresh world — a bug that only appears with one sequence of rolls, a benchmark
# that has to be comparable between runs.
#
# It has no effect on a shard with a save behind it: the save carries where the
# generator got to and a restart picks that up, because re-seeding at boot would
# deal the previous run's rolls all over again.
#seed = 1

# Where a new character appears. The height comes from the map, not from here.
#
# This default is open ground on one facet and may be open water on yours.
[world.start]
x = 1363
y = 1600

[persistence]
# Where the world is kept. Leave empty to keep it in memory and lose it at stop;
# give it a value to have characters survive a restart. A "postgres://" URL uses
# PostgreSQL; anything else is a SQLite file path. Neither backend is a tier.
#
#   database = "openshard.db"
#   database = "postgres://user:pass@localhost/openshard"
database = ""

# How often to save the world, in seconds. The save never stops the world (an
# instant snapshot, written off to the side), so this is only how much play a
# crash could cost. A clean shutdown and the staff ".save" command always save.
# 0 turns the periodic save off. Default is 180.
#   save_seconds = 120
save_seconds = 180

[watchdog]
# What the shard does when it stops keeping its own tick rate.
#
# Every duration the shard puts on the wire — a bow's interval, an animation's
# stretch, a decay, a criminal flag — is a count of ticks converted at 40 a
# second. A tick that is not 25ms long therefore does not make the shard late, it
# makes every number the shard says WRONG, and neither the client nor any
# tick-counting test can notice: both sides of what they compare are in the unit
# that slipped. This has happened: the tick fell to 6.9 a second, a bow announced
# 1.6s and landed at 6.5s, and the shard reported nothing because in its own
# units it was correct throughout.
#
# So a shard that has been behind for this many consecutive seconds stops itself,
# saying why. It is a clean stop and not a crash: the world is saved on the way
# out. A single slow tick never trips it — that is a disk, a big save, a busy
# machine — only a run of whole seconds, which is the shard itself.
#
# 0 turns the stop off and leaves only the log line. Default is 60.
#   tick_behind_windows = 120
tick_behind_windows = 60

[metrics]
# Where the shard answers questions about ITSELF, over HTTP:
#
#   GET /metrics   the Prometheus text exposition — tick rate against the rate
#                  the shard publishes, the busy share that says whether a slow
#                  window is the tick or the machine, the worst tick in it, how
#                  many writes and rows the save task still owes the disk,
#                  connections, uptime.
#   GET /health    the same instant as JSON, plus the worst tick's command mix.
#                  200 while the shard is taking play, 503 once it has been asked
#                  to stop and is saving on its way out.
#
# Commented out, and that is the default: a shard publishes nothing until an
# operator says where. Uncommenting it opens a SECOND port, and that port has NO
# AUTHENTICATION — anyone who can reach it can read the numbers above. Bind it to
# loopback, or to an interface only your monitoring can reach. The shard warns at
# boot if you bind it anywhere else.
#
# Not the same port as server.listen: that one is the game, and the two cannot
# share a socket.
#   listen = "127.0.0.1:9598"

[gameplay]
# The rules knobs — the SphereServer sphere.ini equivalents. Every value here has
# a working default; uncomment one only to change the shard's feel.

# Which swing-speed formula combat uses (Sphere's CombatEra). Implemented:
#   1 pre-AoS      2 AoS
# Sphere's 0, 3 and 4 need weapon weight or ML-format speeds not built yet.
combat_era = 1

# The swing formula's numerator (Sphere's SpeedScaleFactor). Larger is slower.
# OpenShard's responsive pre-AoS pace is 10000; classic Sphere is 15000.
# AoS uses 40000.
speed_scale_factor = 10000

# Shard-specific critical hits (not a classic-UO rule). The chance is per mille:
# 50 = 5%. A critical multiplies normally scaled weapon/archery damage before
# armour and resistances; set chance to 0 for strictly classic rolls.
critical_chance = 50
critical_damage_percent = 150

# Milliseconds between a hunting creature's steps. The classic pace is 400 —
# slower than a running player (250), so outrunning a monster works the way it
# always has. Set 250 to let monsters keep pace with a runner.
# creature_step_ms = 400

# The ceiling any one skill trains to, in tenths (1000 = 100.0).
skill_cap = 1000

# How long an item lies on the ground before it rots, in seconds. Set 0 to
# disable cleanup of loose items and corpses entirely.
decay_seconds = 1200

# How long a house stands without being refreshed before it collapses, in
# seconds. Five days. Opening its sign refreshes it; 0 turns decay off.
house_decay_seconds = 432000

# How long a criminal flag lasts after a grey act, in seconds.
criminal_seconds = 120

# How far speech carries, in tiles: normal, a whisper, a yell.
distance_talk = 18
distance_whisper = 3
distance_yell = 31

# How a spell is cast — the Sphere-vs-ServUO knob.
#   "servuo"  the UO original: the caster stops, says the words over a cast
#             delay, and the target cursor comes up only after (then it may walk).
#   "sphere"  Sphere's feel: the spell resolves as it is cast, no rooting — the
#             caster keeps walking, and any target cursor comes up at once.
cast_style = "servuo"

# Whether taking damage while casting disturbs the spell (UO's fizzle). Only
# bites in the "servuo" cast style, where there is a cast delay to interrupt.
spell_disturb = true

# AoS object tooltips — the "cliloc" hover names, Sphere's TOOLTIPMODE.
#   "version"  send a revision when a thing is drawn, and the full tooltip only
#              when the client asks for it (the bandwidth-cheap standard).
#   "full"     send the whole tooltip up front.
#   "off"      no tooltips, and do not advertise AoS — a modern client then falls
#              back to the classic single-click name label.
tooltips = "version"

# Whether to offer right-click / single-click context menus (the 0xBF popup):
# open a container, a vendor's buy/sell, a paperdoll. With tooltips = "off" and
# this false, the classic client stays on plain single-click names.
context_menus = true

# Spell cost — mana and reagents. Independent of the cast style above.
#
# Sphere confirmed the model: mana and reagents are spent at *resolution*, once
# the cast has succeeded or fizzled — not up front — so the two "loss on fail"
# knobs decide what a fizzle costs (Sphere's ManaLossFail / ReagentLossFail). A
# successful cast always spends. The ServUO/UO original is all three true.
#
# reagents               require and consume reagents (false = cast from mana
#                        alone, a no-reagent shard).
# mana_loss_on_fail      a fizzled cast still burns the mana (false refunds it).
# reagent_loss_on_fail   a fizzled cast still consumes the reagents.
reagents = true
mana_loss_on_fail = true
reagent_loss_on_fail = true

# The bank box, and what it is good for.
#
# UO's own answer to both is what these ship as. A bank box is a *virtual* item
# in ServUO: its contents are not carried, so they weigh nothing (always true
# here, whatever these say) and its gold is not on the status bar — which is the
# reason a banker has to be asked for a balance. But a vendor does reach it: a
# purchase takes from the pack, and failing that from the bank, saying which
# paid.
#
# bank_gold_in_status    add the bank's gold to the status bar's gold field.
# vendor_bank_payment    let an NPC purchase fall back to the bank.
bank_gold_in_status = false
vendor_bank_payment = true

# Level of detail — an opt-in performance knob. When lod is on, a creature with
# no player within lod_radius tiles stops paying for the full AI decision (line
# of sight, target scan, pathfinding) each beat, and dozes at a beat stretched
# lod_idle_factor times slower instead — it wakes the instant a player comes
# within range. Off by default: every creature simulates at full rate whether or
# not anyone is near. lod_radius is kept above the view range (18) and the
# largest creature sight, so a creature a player can see is never dozed.
# lod = false
# lod_radius = 32
# lod_idle_factor = 8

# The sky, and the town watch.
#
# uo_minute_seconds  how many real seconds one UO minute lasts. 5 is ServUO's
#                    rate: a whole UO day in two real hours, night falling around
#                    22:00 and lifting around 06:00. Raise it for longer days.
#                    The clock is derived from the tick counter, never a wall
#                    clock, so it replays — and it is saved, so a restart does
#                    not put the world back at midnight.
# season             what the client draws: 0 spring, 1 summer, 2 fall,
#                    3 winter, 4 desolation. Sent once, on world entry.
# guards             whether guards answer in the regions marked guarded. Off
#                    makes every town as lawless as the woods.
uo_minute_seconds = 5
season = 0
guards = true

# Townsfolk daily routine — at their posts by day, at home by night.
#
# Off by default, and marked as ours rather than a port: neither reference ties an
# NPC to the clock. ServUO's nearest equivalent is a hand-placed WayPoint chain a
# builder walks an NPC along, with no notion of the hour. It also does nothing
# until the pack gives its NPCs somewhere to go, so turning it on alone is safe.
#
# The working day may not wrap midnight — work must come before home, and both
# under 24 — because exactly one comparison reads them and a wrapped day would
# strand every NPC at one end of it.
# npc_schedule = false
# npc_work_hour = 7
# npc_home_hour = 21

# What the world does to a blow or a draw that is already under way —
# docs/combat/design_actions.md's D4. A rule is a pair: a condition the shard already
# knows, and an effect on the action running when it becomes true.
#
# The conditions are `running`, `walking` and `mounted` (all three charged at a
# step), `struck` (a wound taken while the action runs) and `blinded` (the line
# to the committed target is cut). The effects are:
#
#   "break"                       the action ends, and the actor is told why
#   { slow = { percent = 50 } }   push the impact out by half of what was left
#   { sway = { penalty = 25 } }   take 25% off the hit roll (negative steadies)
#
# A condition is charged ONCE per action, so a long draw taken at a run is
# swayed once rather than once per stride.
#
# Below is the table the shard already runs, left commented because uncommenting
# it changes nothing: walking is free, running sways a shot, a mount is neutral,
# and a cut line ends any of the three. A row you write is the WHOLE row for
# that kind — a condition you leave out of it is no rule, not the shipped
# default merged back in — so edit these rows rather than adding a bare one.
#
# They are the last thing in [gameplay] on purpose: a table header ends the
# section above it, so a key written after one of them would belong to the row
# rather than to [gameplay].
#
# [gameplay.action_rules.swing]
# blinded = "break"
#
# [gameplay.action_rules.shot]
# running = { sway = { penalty = 25 } }
# blinded = "break"
#
# [gameplay.action_rules.breath]
# blinded = "break"

# How long each kind of action takes, as a PERCENTAGE of what the weapon's own
# row and the swing formula above come to. 100 is the formula's answer, 50 is
# twice as fast, 200 is half.
#
# A percentage and not an interval, because dexterity and the weapon still have
# to matter: a shard that wrote `shot = 1600ms` would have made every bow, every
# archer and every point of dexterity the same speed. This scales that answer.
#
# The shipped shot is 64 rather than 100, and it is the one row that is not the
# formula's own: the pre-AoS speed column puts a bow at default dexterity at two
# and a half seconds between arrows, which reads on screen as a body standing
# about between shots, and no integer in that column lands on a rounder number.
# 64 is what makes it 1.6 seconds. Every other bow and every other archer scales
# with it.
#
# A scripted SwingSpeed on one creature is NOT scaled by this — it is already the
# last word about that creature's pace.
#
# [gameplay.action_speed]
# swing = 100
# shot = 64
# breath = 100

# How a running action's interval divides into the stretches a watcher is told
# about, as percentages — docs/combat/design_actions.md's D12. The RELEASE is whatever
# is left over, so these must not add up past 100.
#
# Two and not three: there is no `aim` share, and that is a decision rather than
# an omission. Aiming is HOLDING, and an action running through an interval holds
# nothing — its impact is coming whether or not anybody waits for it. Given a
# share, what it drew was a bow already bent with nothing happening, which is a
# delay with no cause. `Aim` is the stretch an ARMED action sits in, and nothing
# in this table can produce one.
#
# The rows below are the ones the shard already runs — a blow is mostly its
# wind-up, a bow is mostly its draw, a breath is mostly the filling of the lungs.
# A row you write is the WHOLE row, as with action_rules above.
#
# [gameplay.action_stages.swing]
# ready = 15
# load = 65
#
# [gameplay.action_stages.shot]
# ready = 10
# load = 70
#
# [gameplay.action_stages.breath]
# ready = 20
# load = 60

# Development accounts, in plaintext, until there is a database.
#
# `access` is what a staff command is gated on, and it ships absent — so this
# account is an ordinary player despite its name. That is deliberate: this file
# is written on first run with a password anyone can read, and a shard that
# handed out authority to it would be owned by whoever guessed two words.
#
# It is also the one thing here that goes wrong *silently*. A `.` command from an
# account without the authority is not refused — it is **spoken**, out loud, over
# your character's head, because a player is allowed to say ".hello". So `.admin`
# with this file as it ships puts the words ".admin" in the chat and opens
# nothing, and there is no error anywhere to explain it.
#
# Uncomment the line below to make this account staff. The level is re-derived
# from this file at every login and never saved with the character, so a restart
# and a relog are all it takes — and it is `administrator`, `gamemaster`, `gm` or
# `player`, case-insensitively. An unknown word is logged and treated as
# `player`: authority is never granted by a typo.
[[accounts]]
name = "admin"
password = "hunter2"
characters = ["Lord British"]
# access = "administrator"
