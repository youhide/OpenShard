[package]
name = "openshard-uofiles"
description = "Readers for the client's data files: the map, tiledata, and the UOP container format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# `surfaces` and `radarcol` read the world, and `map` is the importer that
# builds one: the world type lives in `openshard-map` and nothing here owns it.
openshard-map.workspace = true
openshard-protocol.workspace = true
# What `tiledata` reads *into*: the two tables, the flags on them and the ids
# that name them. A table is not a file, so it lives in its own crate and this
# one is only the reader that fills it.
openshard-tiles.workspace = true
# For `openshard-map-import`, the binary that chains this crate's reader to our
# own base set. The dependency runs this way round on purpose: the base set
# knows nothing of a UO install, and the thing that reads one is what knows both.
openshard-basemap.workspace = true
# The binary's command line. See the note on this dependency in the workspace
# `Cargo.toml`.
clap.workspace = true
# For gumpart: every entry in `gumpartLegacyMUL.uop` is zlib-compressed. See
# the note on this dependency in the workspace `Cargo.toml`.
miniz_oxide.workspace = true
# For `ttf_font`: rasterizing an operator-supplied Unicode fallback face. See
# the note on this dependency in the workspace `Cargo.toml`.
fontdue.workspace = true
