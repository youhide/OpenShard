[package]
name = "openshard-map"
description = "The world: one facet of ground and statics, and which published revision of it you hold."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
openshard-protocol.workspace = true
# The id a cell of ground holds: `LandTileId`, which indexes the land table. The
# table is not here and neither is a file -- the crate that declares it opens
# none, so a world made of tiles can name what it is made of.
openshard-tiles.workspace = true
# The overlay is keyed by tile and read on every step: a hash map that is fast
# rather than hardened, the same one `openshard-movement` picked when this type
# lived there.
rustc-hash.workspace = true
